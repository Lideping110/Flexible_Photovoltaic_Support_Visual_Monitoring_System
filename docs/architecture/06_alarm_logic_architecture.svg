<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1160" width="1120" height="1160" role="img" font-family="sans-serif">
<title>报警逻辑架构 · 立柱倾角报警 + 振动测振三类触发与数据留存</title>
<desc>本图主体详述振动测振链路：SpectrumAnalyzer._finalize 每个 30s 固定窗按 (cam_id,pid) 结算，三类阈值任一命中即留存报警数据：振幅(真实量)、索力(占位)、挠度(占位)。三者共享同一份 analysis 与同一视频片段，RTSP 切窗请求每窗口仅发一次。按源类型分流留存：RTSP 实时源由 MarkerCapture 滚动缓冲切出 {当前时间}_original.mp4(H.264,web 可播)；文件源由 supervisor 收尾经 clip_retention ffmpeg -c copy 切出 {t0}_{t1}_original.mp4(原生编码,不转 web)。两类源均写 output/vibration/&lt;id&gt;.json 侧车。底部对照条说明另一条链路——立柱倾角报警在 PoleInference 内联触发、直接调 alarm_store 逐帧落盘(不经 Recorder)，与振动链路形状不同。dashboard 读 events.jsonl + manifest.jsonl + 侧车聚合到报警记录页。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<linearGradient id="gIndigo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#403763"/><stop offset="1" stop-color="#2E2850"/></linearGradient>
<linearGradient id="gAmp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20424B"/><stop offset="1" stop-color="#16323A"/></linearGradient>
<linearGradient id="gCable" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E2848"/><stop offset="1" stop-color="#221D38"/></linearGradient>
<linearGradient id="gDefl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E3826"/><stop offset="1" stop-color="#2E2A1C"/></linearGradient>
<linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A3308"/><stop offset="1" stop-color="#3E2406"/></linearGradient>
<linearGradient id="gTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A5546"/><stop offset="1" stop-color="#073C32"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11518F"/><stop offset="1" stop-color="#0B3C6C"/></linearGradient>
</defs>
<rect x="0" y="0" width="1120" height="1160" fill="#2B2B28"/>

<!-- ===================== TITLE ===================== -->
<rect x="0" y="0" width="1120" height="4" fill="#D85A30"/>
<text x="560" y="34" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="#E6E4DA">报警逻辑架构 · 振动测振「三类触发条件 → 数据留存」</text>
<text x="560" y="58" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#9A988F">振幅(真实量) + 索力(占位) + 挠度(占位)　·　任一命中即留存　·　同窗共享 analysis 与视频片段　·　按源类型分流（RTSP 滚动缓冲 / 文件流拷贝）</text>

<!-- ===================== SECTION 1 : 触发判定 ===================== -->
<rect x="40" y="78" width="1040" height="224" rx="12" fill="#3A3A37" stroke="#888780" stroke-width="0.6"/>
<rect x="40" y="78" width="1040" height="4" rx="2" fill="#D85A30"/>
<text x="56" y="104" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#D3D1C7">① 触发判定 — <tspan font-family="monospace" fill="#CECBF6">SpectrumAnalyzer._finalize</tspan>　每个 30s 固定不重叠窗，按 (cam_id, pid) 结算一次</text>

<!-- amplitude card -->
<rect x="56" y="118" width="322" height="136" rx="9" fill="url(#gAmp)" stroke="#39C5CF" stroke-width="0.7"/>
<text x="72" y="140" dominant-baseline="central" font-size="13" font-weight="700" fill="#8FE8EC">振幅幅值 · amplitude</text>
<text x="366" y="140" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="600" fill="#7FE3E8">真实量</text>
<text x="72" y="162" dominant-baseline="central" font-size="10.5" fill="#B7E6EA">窗口内累计位移模长最大值（mm）</text>
<text x="72" y="182" dominant-baseline="central" font-size="10.5" fill="#8FE8EC">≥ marker.alarm.amplitude_mm</text>
<text x="72" y="200" dominant-baseline="central" font-size="10.5" fill="#7A9095">默认 5.0　·　&gt;0 启用 / ≤0 关闭</text>
<text x="72" y="222" dominant-baseline="central" font-size="10.5" font-weight="600" fill="#39C5CF">→ emit amplitude_alarm</text>
<text x="72" y="240" dominant-baseline="central" font-size="9.5" fill="#7A9095">id = {cam}_{pid}_w{seg}</text>

<!-- cable card -->
<rect x="394" y="118" width="322" height="136" rx="9" fill="url(#gCable)" stroke="#BC8CFF" stroke-width="0.7"/>
<text x="410" y="140" dominant-baseline="central" font-size="13" font-weight="700" fill="#DCC6FF">索力 · cable force</text>
<text x="704" y="140" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="600" fill="#C9AEFF">占位值</text>
<text x="410" y="162" dominant-baseline="central" font-size="10.5" fill="#D6C6F2">marker.placeholder.cable_force_idx</text>
<text x="410" y="182" dominant-baseline="central" font-size="10.5" fill="#DCC6FF">≥ marker.alarm.cable_force_idx</text>
<text x="410" y="200" dominant-baseline="central" font-size="10.5" fill="#9C90B8">默认关(0.0)·占位默认100→设80可演示</text>
<text x="410" y="222" dominant-baseline="central" font-size="10.5" font-weight="600" fill="#BC8CFF">→ emit cable_force_alarm</text>
<text x="410" y="240" dominant-baseline="central" font-size="9.5" fill="#9C90B8">id = {cam}_{pid}_w{seg}_cable</text>

<!-- deflection card -->
<rect x="732" y="118" width="322" height="136" rx="9" fill="url(#gDefl)" stroke="#FFD479" stroke-width="0.7"/>
<text x="748" y="140" dominant-baseline="central" font-size="13" font-weight="700" fill="#FFE7AC">挠度 · deflection</text>
<text x="1042" y="140" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="600" fill="#FFD479">占位值</text>
<text x="748" y="162" dominant-baseline="central" font-size="10.5" fill="#F2E2BC">marker.placeholder.deflection_mm</text>
<text x="748" y="182" dominant-baseline="central" font-size="10.5" fill="#FFE7AC">≥ marker.alarm.deflection_mm</text>
<text x="748" y="200" dominant-baseline="central" font-size="10.5" fill="#A79B78">默认关(0.0)·占位0.0→真实模型就绪前不触发</text>
<text x="748" y="222" dominant-baseline="central" font-size="10.5" font-weight="600" fill="#FFD479">→ emit deflection_alarm</text>
<text x="748" y="240" dominant-baseline="central" font-size="9.5" fill="#A79B78">id = {cam}_{pid}_w{seg}_defl</text>

<text x="560" y="272" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#D3D1C7">三条件任一命中 → 在该窗口留存报警数据；三者<tspan font-weight="700" fill="#FFD479">共享同一份 analysis 与同一视频片段</tspan>，RTSP 切窗请求每窗口<tspan font-weight="700" fill="#F0997B">仅发一次</tspan>（any_alarm 守卫，防重复切窗）。</text>
<text x="560" y="290" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9A988F">索力/挠度占位值 = 物理模型未定、不造假；真实模型接入后替换占位值，报警逻辑零改动。</text>

<!-- connector S1 -> S2 -->
<path d="M560 302 V320" fill="none" stroke="#888780" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- ===================== SECTION 2 : 共享数据 + 事件 ===================== -->
<rect x="40" y="322" width="1040" height="152" rx="12" fill="#3A3A37" stroke="#888780" stroke-width="0.6"/>
<rect x="40" y="322" width="1040" height="4" rx="2" fill="#AFA9EC"/>
<text x="56" y="346" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#D3D1C7">② 同窗共享数据 + 三类事件（各自独立 id，事件均内嵌同一份 analysis）</text>

<!-- shared analysis box -->
<rect x="56" y="358" width="520" height="102" rx="9" fill="url(#gIndigo)" stroke="#AFA9EC" stroke-width="0.6"/>
<text x="72" y="378" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#CECBF6">共享 analysis（每个事件都内嵌）</text>
<text x="72" y="398" dominant-baseline="central" font-size="10.5" fill="#B4B2A9">frequency_hz = SNR 更高轴 f1 · amplitude_mm（真实）</text>
<text x="72" y="416" dominant-baseline="central" font-size="10.5" fill="#B4B2A9">deflection_mm(占位) · cable_force_idx(占位) · 三个阈值列</text>
<text x="72" y="434" dominant-baseline="central" font-size="10.5" fill="#B4B2A9">source(realtime/file) · window/t0/t1</text>
<text x="72" y="452" dominant-baseline="central" font-size="10" fill="#8C8A83">clip：实时流预留 /media/output/vibration/{当前时间}_original.mp4</text>

<!-- events chips -->
<rect x="592" y="358" width="472" height="102" rx="9" fill="url(#gIndigo)" stroke="#AFA9EC" stroke-width="0.6"/>
<text x="608" y="378" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#CECBF6">emit 事件 → events.jsonl（Recorder 单写者·阻塞不丢）</text>
<rect x="608" y="388" width="440" height="20" rx="5" fill="url(#gAmp)" stroke="#39C5CF" stroke-width="0.5"/>
<text x="616" y="398" dominant-baseline="central" font-size="10" fill="#8FE8EC">amplitude_alarm</text>
<text x="1040" y="398" text-anchor="end" dominant-baseline="central" font-size="9.5" fill="#7A9095">id = {cam}_{pid}_w{seg}</text>
<rect x="608" y="412" width="440" height="20" rx="5" fill="url(#gCable)" stroke="#BC8CFF" stroke-width="0.5"/>
<text x="616" y="422" dominant-baseline="central" font-size="10" fill="#DCC6FF">cable_force_alarm</text>
<text x="1040" y="422" text-anchor="end" dominant-baseline="central" font-size="9.5" fill="#9C90B8">id = {cam}_{pid}_w{seg}_cable</text>
<rect x="608" y="436" width="440" height="20" rx="5" fill="url(#gDefl)" stroke="#FFD479" stroke-width="0.5"/>
<text x="616" y="446" dominant-baseline="central" font-size="10" fill="#FFE7AC">deflection_alarm</text>
<text x="1040" y="446" text-anchor="end" dominant-baseline="central" font-size="9.5" fill="#A79B78">id = {cam}_{pid}_w{seg}_defl</text>

<!-- connector S2 -> S3 -->
<path d="M560 474 V492" fill="none" stroke="#888780" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- ===================== SECTION 3 : 留存双路径 ===================== -->
<rect x="40" y="494" width="1040" height="322" rx="12" fill="#3A3A37" stroke="#888780" stroke-width="0.6"/>
<rect x="40" y="494" width="1040" height="4" rx="2" fill="#5DCAA5"/>
<text x="56" y="518" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#D3D1C7">③ 报警数据留存 — 按源类型分流，同窗片段共享（不重复抽取）</text>

<!-- LEFT : RTSP realtime -->
<text x="56" y="540" dominant-baseline="central" font-size="12" font-weight="700" fill="#FAC775">📡 RTSP 实时源</text>
<rect x="56" y="550" width="496" height="46" rx="8" fill="url(#gAmber)" stroke="#EF9F27" stroke-width="0.6"/>
<text x="72" y="566" dominant-baseline="central" font-size="10.5" fill="#FAC775">spectrum → clip_q.put（每窗仅 1 次，片段共享）</text>
<text x="72" y="584" dominant-baseline="central" font-size="9.5" fill="#C98A2E">{cam_id, t0, t1, out_path, transcode=True}</text>
<path d="M304 596 V614" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="56" y="616" width="496" height="72" rx="8" fill="url(#gAmber)" stroke="#EF9F27" stroke-width="0.6"/>
<text x="72" y="634" dominant-baseline="central" font-size="11" font-weight="600" fill="#FAC775">MarkerCapture · RollingBuffer 滚动缓冲</text>
<text x="72" y="652" dominant-baseline="central" font-size="9.5" fill="#E0A85A">output/rtsp_buffer/&lt;cam_id&gt;/seg_*.mp4</text>
<text x="72" y="670" dominant-baseline="central" font-size="9.5" fill="#C98A2E">保留 rtsp_rolling_s=120s · 分段 rtsp_seg_s=10s · 断线重连</text>
<path d="M304 688 V706" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="56" y="708" width="496" height="46" rx="8" fill="url(#gAmber)" stroke="#EF9F27" stroke-width="0.6"/>
<text x="72" y="724" dominant-baseline="central" font-size="10.5" font-weight="600" fill="#FAC775">切出 [t0,t1] → output/vibration/{当前时间}_original.mp4</text>
<text x="72" y="742" dominant-baseline="central" font-size="9.5" fill="#C98A2E">转 H.264 + faststart · web 可播（当前时间命名）</text>

<!-- RIGHT : file source -->
<text x="568" y="540" dominant-baseline="central" font-size="12" font-weight="700" fill="#9FE1CB">📁 文件源（视频数据）</text>
<rect x="568" y="550" width="496" height="46" rx="8" fill="url(#gTeal)" stroke="#5DCAA5" stroke-width="0.6"/>
<text x="584" y="566" dominant-baseline="central" font-size="10.5" fill="#9FE1CB">supervisor 收尾（见 .rec_done 后）</text>
<text x="584" y="584" dominant-baseline="central" font-size="9.5" fill="#4FB394">viz/clip_retention.retain_vibration_clips(cfg)</text>
<path d="M816 596 V614" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="568" y="616" width="496" height="72" rx="8" fill="url(#gTeal)" stroke="#5DCAA5" stroke-width="0.6"/>
<text x="584" y="634" dominant-baseline="central" font-size="11" font-weight="600" fill="#9FE1CB">ffmpeg -c copy 流拷贝切片</text>
<text x="584" y="652" dominant-baseline="central" font-size="9.5" fill="#4FB394">保持原生编码（不转 web）· ffmpeg 缺失回退 OpenCV 重封装</text>
<text x="584" y="670" dominant-baseline="central" font-size="9.5" fill="#3E9C7F">按事件内嵌 analysis.t0/t1 切，不用 ffprobe 猜测</text>
<path d="M816 688 V706" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="568" y="708" width="496" height="46" rx="8" fill="url(#gTeal)" stroke="#5DCAA5" stroke-width="0.6"/>
<text x="584" y="724" dominant-baseline="central" font-size="10.5" font-weight="600" fill="#9FE1CB">→ output/vibration/{t0}_{t1}_original.mp4</text>
<text x="584" y="742" dominant-baseline="central" font-size="9.5" fill="#3E9C7F">片段已存在则复用（同窗多条件共享 · 幂等）</text>

<!-- converge box -->
<path d="M304 754 V772 M816 754 V772" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="200" y="770" width="720" height="48" rx="8" fill="url(#gIndigo)" stroke="#AFA9EC" stroke-width="0.6"/>
<text x="560" y="786" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="600" fill="#CECBF6">output/vibration/&lt;id&gt;.json 侧车 — analysis + source + clip（web 可播）+ clip_native（原文件）（幂等）</text>
<text x="560" y="806" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#8FE8EC">双产物：{原名}_original.mp4 原文件<tspan fill="#F0997B" font-weight="600">保留不删</tspan>　+　{原名}_h264.mp4 <tspan fill="#8FE8EC" font-weight="600">web 可播</tspan>（探源编码：仅 h264 才 copy，否则转码）</text>

<!-- connector S3 -> S4 -->
<path d="M560 816 V834" fill="none" stroke="#888780" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- ===================== SECTION 4 : 落盘 + 大屏 ===================== -->
<rect x="40" y="836" width="520" height="86" rx="11" fill="#0C447C" stroke="#85B7EB" stroke-width="0.6"/>
<rect x="40" y="836" width="520" height="4" rx="2" fill="#85B7EB"/>
<text x="56" y="858" dominant-baseline="central" font-size="12" font-weight="700" fill="#B5D4F4">events.jsonl（Recorder 落盘）</text>
<text x="56" y="878" dominant-baseline="central" font-size="10.5" fill="#85B7EB">三类报警事件均写入；load_alarm_events 筛出报警类</text>
<text x="56" y="898" dominant-baseline="central" font-size="10" fill="#5E93C4">含 analysis/clip/level/detail；ts=窗口实际终点</text>

<rect x="584" y="836" width="496" height="86" rx="11" fill="#0C447C" stroke="#85B7EB" stroke-width="0.6"/>
<rect x="584" y="836" width="496" height="4" rx="2" fill="#85B7EB"/>
<text x="600" y="858" dominant-baseline="central" font-size="12" font-weight="700" fill="#B5D4F4">dashboard · build_records → 报警记录页</text>
<text x="600" y="878" dominant-baseline="central" font-size="10.5" fill="#85B7EB">读 events + vibration/&lt;id&gt;.json 侧车；筛选：立柱/索力/振幅/挠度</text>
<text x="600" y="898" dominant-baseline="central" font-size="10" fill="#5E93C4">详情 = &lt;video&gt; 播 clip(_h264) + 原文件下载 + 分析（含阈值列）</text>

<!-- ===================== LEGEND ===================== -->
<rect x="40" y="930" width="1040" height="26" rx="6" fill="#333330" stroke="#5F5E5A" stroke-width="0.4"/>
<circle cx="58" cy="943" r="5" fill="#39C5CF"/><text x="70" y="943" dominant-baseline="central" font-size="10" fill="#B4B2A9">振幅 amplitude（真实）</text>
<circle cx="220" cy="943" r="5" fill="#BC8CFF"/><text x="232" y="943" dominant-baseline="central" font-size="10" fill="#B4B2A9">索力 cable（占位）</text>
<circle cx="382" cy="943" r="5" fill="#FFD479"/><text x="394" y="943" dominant-baseline="central" font-size="10" fill="#B4B2A9">挠度 deflection（占位）</text>
<text x="1064" y="943" text-anchor="end" dominant-baseline="central" font-size="10" fill="#9A988F">三色 = 大屏报警徽标配色（t-amp / t-cable / t-defl）　·　阈值 &gt;0 启用</text>

<!-- ===================== 另一条链路：立柱倾角报警（对照） ===================== -->
<rect x="40" y="970" width="1040" height="176" rx="12" fill="#3A3A37" stroke="#D85A30" stroke-width="0.7"/>
<rect x="40" y="970" width="1040" height="4" rx="2" fill="#D85A30"/>
<text x="56" y="994" dominant-baseline="central" font-size="13" font-weight="700" fill="#F0997B">另一条链路 · 立柱倾角报警（pole）　—　与上方振动链路形状不同：进程内联旁路，不经事件队列</text>

<rect x="56" y="1010" width="252" height="120" rx="8" fill="#5A2410" stroke="#D85A30" stroke-width="0.6"/>
<text x="72" y="1028" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#F0997B">触发</text>
<text x="72" y="1050" dominant-baseline="central" font-size="10.5" fill="#F0A98F">PoleInference 内 <tspan font-family="monospace">if alarm:</tspan></text>
<text x="72" y="1068" dominant-baseline="central" font-size="10.5" fill="#F0A98F">|ΔLR|≥2.0° 或 |ΔFB|≥2.0°</text>
<text x="72" y="1086" dominant-baseline="central" font-size="10.5" fill="#F0A98F">或 |Δ总|≥2.5°（任一命中）</text>
<text x="72" y="1108" dominant-baseline="central" font-size="10" fill="#C97B5E">逐帧判定 · 阈值 pole.alarm</text>

<rect x="322" y="1010" width="252" height="120" rx="8" fill="#5A2410" stroke="#D85A30" stroke-width="0.6"/>
<text x="338" y="1028" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#F0997B">节流 + 落盘（旁路）</text>
<text x="338" y="1050" dominant-baseline="central" font-size="10.5" fill="#F0A98F">cooldown_s 5.0s（每 cam+pid）</text>
<text x="338" y="1068" dominant-baseline="central" font-size="10.5" fill="#F0A98F">直调 utils/alarm_store 写盘</text>
<text x="338" y="1086" dominant-baseline="central" font-size="10.5" fill="#F0A98F">⚠ 不经 result_q / Recorder</text>
<text x="338" y="1108" dominant-baseline="central" font-size="10" fill="#C97B5E">与振动链路的本质差异</text>

<rect x="588" y="1010" width="252" height="120" rx="8" fill="#5A2410" stroke="#D85A30" stroke-width="0.6"/>
