<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" font-family="sans-serif">
<title>初始基准持久化：首帧保存与重启加载（实际实现）</title>
<desc>推理进程收到每摄像头首张成功帧时检查 init_state.json，存在则加载锚点与基准不再保存，不存在则推理建立锚点并原子保存初始图片与初始数据（含 version/created_at，WinError5 重试×6）。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="760" height="600" fill="#2B2B28"/>
<rect x="0" y="0" width="760" height="4" fill="#7F77DD"/>
<text x="40" y="38" dominant-baseline="central" font-size="15" font-weight="600" fill="#D3D1C7">初始基准持久化 · 两个分支同理（pole / marker）</text>

<rect x="40" y="62" width="680" height="50" rx="8" fill="#444441" stroke="#888780" stroke-width="0.5"/>
<text x="380" y="80" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#D3D1C7">推理进程收到某摄像头首张成功帧（检测非空 · 图像可用）</text>
<text x="380" y="100" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#B4B2A9">立柱分支：首个含立柱的 1fps 帧；靶标分支：首个锁定靶标的帧（无检测则持续重试，每 10s 告警，不静默死亡）</text>

<path d="M380 112 V132" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="280" y="134" width="200" height="44" rx="22" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="380" y="156" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#B5D4F4">init_state.json 已存在？</text>

<path d="M280 156 H150 V196" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="208" y="146" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#9FE1CB">是 · 项目重启 / 非 refresh</text>
<path d="M480 156 H610 V196" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="552" y="146" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#FAC775">否 · 首次运行 / --refresh-init</text>

<rect x="40" y="200" width="320" height="140" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="200" y="222" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#9FE1CB">加载持久化初始状态</text>
<text x="60" y="246" dominant-baseline="central" font-size="11" fill="#5DCAA5">anchors.load_anchors(targets)</text>
<text x="60" y="266" dominant-baseline="central" font-size="11" fill="#5DCAA5">· 锚点框 + 持久 ID（P1..P4）</text>
<text x="60" y="286" dominant-baseline="central" font-size="11" fill="#5DCAA5">· 注入 monitor.baseline（初始角度）</text>
<text x="60" y="306" dominant-baseline="central" font-size="11" fill="#5DCAA5">· 靶标：加载初始位置 + mm/px</text>
<text x="60" y="326" dominant-baseline="central" font-size="11" fill="#5DCAA5">跳过基准建立期 · delta 延续重启前</text>

<rect x="400" y="200" width="320" height="140" rx="8" fill="#633806" stroke="#EF9F27" stroke-width="0.5"/>
<text x="560" y="222" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#FAC775">建立并保存初始状态</text>
<text x="420" y="246" dominant-baseline="central" font-size="11" fill="#EF9F27">首帧推理 → 生成锚点（框·持久ID·初始角度）</text>
<text x="420" y="266" dominant-baseline="central" font-size="11" fill="#EF9F27">init_frame.jpg（带锚点标注）+ init_state.json</text>
<text x="420" y="286" dominant-baseline="central" font-size="11" fill="#EF9F27">原子写：tmp 文件 → os.replace</text>
<text x="420" y="306" dominant-baseline="central" font-size="11" fill="#EF9F27">头部写 version(=1) + created_at(ISO)</text>
<text x="420" y="326" dominant-baseline="central" font-size="11" fill="#EF9F27">WinError5 退避重试 ×6（0.02→0.32s）</text>

<path d="M560 340 V366" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="400" y="368" width="320" height="56" rx="8" fill="#412402" stroke="#BA7517" stroke-width="0.5"/>
<text x="560" y="390" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#FAC775">基线就绪时重绘 init_frame.jpg</text>
<text x="560" y="408" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#C98A2E">每根基线就绪即叠加拟合线（幂等防抖，不逐帧写盘）</text>

<rect x="40" y="448" width="680" height="120" rx="8" fill="#3A3A37" stroke="#888780" stroke-width="0.5"/>
<text x="56" y="470" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#D3D1C7">存储位置：output/{pole|marker}/{cam_id}/</text>
<text x="56" y="494" dominant-baseline="central" font-size="11" fill="#B4B2A9">├─ init/</text>
<text x="76" y="514" dominant-baseline="central" font-size="11" fill="#B4B2A9">├─ init_frame.jpg   （首帧 + 锚点/拟合线标注）</text>
<text x="76" y="534" dominant-baseline="central" font-size="11" fill="#B4B2A9">└─ init_state.json  （version · cam_id · branch · created_at · targets[]）</text>
<text x="56" y="556" dominant-baseline="central" font-size="11" fill="#B4B2A9">└─ calibration.yaml  （write_calibration_yaml 写，在 init/ 同级，仅 pole 有）</text>
<text x="56" y="578" dominant-baseline="central" font-size="10.5" fill="#7E7C75">换新摄像头或标定变更时 --refresh-init 强制重建；marker 不挂 calibration 块（mm/px 自标定）</text>
</svg>