    task: marker                    # marker = 靶标跟踪（检测模型，逐帧 + 30s FFT）
    # 注意：marker 在原始（未畸变）像素空间做亚像素定位，mm/px 由靶标外圈圆
    # 直径自标定（见 marker.calibration），不需要相机内参/外参（K/dist/R/t），
    # 也不做去畸变——请勿在此挂 calibration 块，否则只会误导、不被加载。
    
  - id: marker_cam_02
    # url: "rtsp://admin:hhjt110110@192.168.1.64:554/streaming/Channels/101"
    url: "babiao/static_video.mp4"
    task: marker
# ---------------------------------------------------------------------
# 模型（每个分支只加载一份，跨摄像头攒批推理）
# ---------------------------------------------------------------------
models:
  pole_seg:
    # 立柱实例分割模型：优先 OpenVINO 导出目录（含 .xml，dynamic 支持多 batch），回退 .pt 权重
    openvino_dir: "./models/pole26s_seg_openvino_model"
    weights: "./models/pole26s_seg.pt"
    confidence: 0.25
    class_id: 0
    device: "intel:gpu"                   # 有 CUDA 可改 "0"；OpenVINO 时用 "cpu" 或 "intel:gpu"
    tracker: "bytetrack.yaml"
  marker_det:
    # 靶标检测模型：优先 OpenVINO 导出目录（含 .xml，dynamic 支持多 batch），回退 .pt 权重
    openvino_dir: "./models/marker26s_det_openvino_model"
    weights: "./models/marker26s_det.pt"
    confidence: 0.25
    class_id: 0
    device: "intel:gpu"             # 无核显时可改 "cpu"
    tracker: "bytetrack.yaml"

# ---------------------------------------------------------------------
# 立柱监测分支参数（字段沿用原 pole_tilt_monitor/config/config.yaml）
# ---------------------------------------------------------------------
pole:
  # 每秒抽取并处理的帧数（不超过源 FPS）
  sample_fps: 1.0
  measurement:
    # "world_3d" = 用外参 R/t + 地面平面 + 杆长恢复 3D 倾角
    # "image_relative" = 只用内参 K/dist，图像坐标系相对倾斜变化
    mode: "image_relative"
    pole_length_m: 3.0              # 仅 world_3d 使用
    ground_z_m: 0.0                 # 仅 world_3d 使用
    endpoint_ratio: 0.10
    ransac_residual_px: 2.5
    ransac_iterations: 300
    body_trim_ratio: 0.10
    quality_threshold: 0.60
    min_ray_plane_angle_deg: 5.0    # 仅 world_3d 使用
    max_centerline_residual_px: 4.0
    max_endpoint_spread_px: 4.0
    max_length_error_ratio: 0.03    # 仅 world_3d 使用
    quality_weights:
      inlier_ratio: 0.30
      centerline_residual: 0.25
      top_stability: 0.12
      bottom_stability: 0.12
      ray_ground_angle: 0.10
      length_constraint: 0.11
  baseline:
    enabled: true
    frames: 60                      # world_3d 模式基准帧数
    relative_frames: 1              # image_relative 模式基准帧数
  filter:
    enabled: true
    alpha: 0.25                     # EMA 平滑系数
  alarm:
    left_right_deg: 2.0
    front_back_deg: 2.0
    total_deg: 2.5
    # 立柱报警留存节流：同一根立柱两次落盘快照的最小间隔（秒），避免持续报警时每秒一张刷屏
    cooldown_s: 5.0

# ---------------------------------------------------------------------
# 靶标跟踪分支参数（字段沿用原 marker_subpixel_tracker/config/config.yaml）
# ---------------------------------------------------------------------
marker:
  fft:
    # 每 window_s 秒一个窗口做一次主频提取（固定不重叠分段）
    window_s: 30.0
    snr: 5.0                        # 主频接受的最小信噪比
    min_samples: 32                 # 窗口内最少样本数，不足不出结果
    min_span_s: 10.0                # 窗口内样本"实际跨度"下限（秒）。看板"频谱图出图"
                                    # 与"主频取值"共用这一条门限（须与 min_samples 同时满足）：
                                    # 不足时只显示"首窗数据累积中 X / 需 Y s"，不画曲线——否则
                                    # 0.3s 的噪声形状会被当成频谱（曾出现"刚开始就有频率曲线"）。
                                    # 源总长不足 30s 时按 min(min_span_s, window_s) 判，不会永远未满窗。
                                    # 若要严格按"满 30s 才出图"，把这里改成 30.0。
  calibration:
    real_diameter_mm: 100.0         # 靶标外圈圆真实直径
    frames: 8                       # 自动标定采集帧数上限
    min_frames: 1                   # 达到即可提前完成标定
  # 振动报警：以下三类阈值，沿用振幅约定——>0 启用，<=0 关闭。
  # 任一类触发都会在该窗口留存报警数据（事件 + 振动分析 + 视频片段），片段共享。
  #  - amplitude_mm    ：位移幅值（mm）真实量，超过阈值触发 amplitude_alarm；
  #  - deflection_mm   ：挠度阈值（mm），与下方 placeholder.deflection_mm（占位值）比较；
  #                      当前占位为 0.0，真实模型就绪前该条件在标准配置下不会触发。
  #  - cable_force_idx ：索力阈值（相对量纲），与 placeholder.cable_force_idx（占位值）
  #                      比较；占位默认 100，设例如 80 即可在占位值下演示触发。
  # 注意：挠度/索力均取自下方 placeholder（物理模型未定），报警分析数据里会显式标注「占位」。
  alarm:
    amplitude_mm: 5.0
    deflection_mm: 0.0
    cable_force_idx: 0.0
    # 报警视频片段保留上限：只保留最近 N 个报警窗口，超出的整组删除
    #（{原名}_original.mp4 + _h264.mp4 + 引用它们的侧车 json，避免磁盘无限增长）。
    # 同一窗口被振幅/挠度/索力多条件同时触发时共享片段，按窗口整组同进同出。
    # 配成 0 / -1 / all / inf 等 = 保留全部（不删除）。默认 10。
    keep_clips: 10
  localization:
    structure_sigma: 1.5
    min_lambda_min: 5000.0
    subpixel_window: 5
    win_ratio: 0.25
    win_max: 20
    min_spacing: 5
    max_jump_px: 3.0
  tracking:
    tracker: "bytetrack.yaml"
    persist: true

  # 挠度 / 索力：物理模型尚未确定（影响二者的因素还没梳理清楚），因此**先不做任何
  # 计算**，界面上直接显示下面的占位值——避免继续用"窗口内位移幅值冒充挠度、
  # 用主频平方比冒充索力"给出看似真实、实则无法解释的数字。
  # 将来真实模型/真实输出就绪后，把 enabled 置 false 改走真实计算，或直接改数值。
  placeholder:
    enabled: true
    deflection_mm: 0.0          # 挠度占位值（mm）
    cable_force_idx: 100.0      # 索力占位值（沿用"首帧=100"的相对量纲）

# ---------------------------------------------------------------------
# 大屏显示（dashboard）参数
# ---------------------------------------------------------------------
dashboard:
  # 实时流显示用的子码流通道：dashboard 后端 cv2 直连 RTSP 子码流（显示用），
  # 与 main 走的主码流（101）分离，两进程互不抢带宽。海康约定主码流 101 / 子码流 102；
  # 由相机 URL 末尾的 Channels/N 自动派生为 Channels/102。无 GUI / 服务器部署必开。
  stream_channel: "101"
  stream_fps: 15                      # 子码流 MJPEG 编码帧率（仅限制推送频率，抓帧仍按源速率）
  reconnect_s: 3.0                   # RTSP 断线后重连间隔（秒）

# ---------------------------------------------------------------------
# 运行参数
# ---------------------------------------------------------------------
runtime:
  output_dir: "output"
  log_level: "INFO"
  display: false                     # 实时叠加窗口开关：true 时本机弹 CV2 GUI 预览窗（仅本地调试用）；现设 false，
  # 实时画面统一在 Web 大屏看（MJPEG 流通道，与 GUI 窗无关）。无 GUI / 服务器 / 只走 Web 务必 false。

  capture:
    mode: threads                   # threads | processes（解码 CPU 吃紧时切换）
    reconnect_s: 5                  # RTSP 断线重连间隔（秒）
    rtsp_low_latency: true          # TCP + nobuffer 低延迟拉流
    rtsp_rolling_s: 120             # RTSP 实时流滚动缓冲时长（秒）：振动报警时由 capture 从中切窗
                                    # 出现报警的时候，会从120s内取数据，然后滚动 cut(t0, t1, out_path)
    rtsp_seg_s: 10                  # 滚动缓冲分段时长（秒/段），落盘 output/rtsp_buffer/<cam_id>/

  batch:
    pole:
      timeout_ms: 500               # 整秒攒批：等齐所有 pole 摄像头或超时
    marker:
      max_frames: 8                 # 滑动攒批：满 N 帧或超时即前向
      timeout_ms: 60

  queue:
    # 帧队列深度同时约束两种投递策略：
    #   - 文件源（非实时）：capture 改用 put_backpressure 背压阻塞写，队列满则
    #     等待消费方腾位，绝不丢帧——marker 逐帧亚像素跟踪必须连续，丢帧即断裂；
    #   - 实时源（RTSP）：沿用 put_latest 丢旧保新，限制端到端延迟（丢帧可接受）。
    # 因此 marker_frame / pole_frame 此处仅作为"背压缓冲深度"或"实时丢旧缓冲"，
    # 文件源下不会因队列有界而丢失中段帧。
    pole_frame: 64                  # pole 帧队列（文件源背压不丢；实时源缓冲抽样流）
    marker_frame: 16                # marker 帧队列深度（文件源=背压缓冲, 实时源=丢旧保新）
    result: 256                     # 推理结果 → Recorder（阻塞写，不丢）
    spectrum: 512                   # 位移时序 → SpectrumAnalyzer

  init:
    # 初始基准持久化：首张成功帧保存图片+初始数据；重启自动加载不再保存。
    # 换新摄像头或标定变更后，用 --refresh-init 强制重建。
    persist: true
    anchor:
      iou_min: 0.3                  # 锚点匹配接受阈值（IoU）—— 仅 pole 立柱用
      release_after_s: 10.0         # 轨迹丢失多久后释放（pole 锚点 / marker raw id 绑定共用）
      ema_alpha: 0.05               # 锚点框 EMA 跟随系数 —— 仅 pole 立柱用
      relock_max_px: 200.0         # marker 重锁门限：未认领新检测框中心距某失主 last_box 超过此值(px)不抢身份；仅 marker 用，避免 N≥4 多目标张冠李戴
