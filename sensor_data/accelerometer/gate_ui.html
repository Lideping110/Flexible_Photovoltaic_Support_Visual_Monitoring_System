<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四门控频率分析 · 双传感器（front / back）</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --line:#e3e7ee; --line2:#eef1f6;
    --tx:#1c2430; --tx2:#5d6878; --tx3:#8b95a5;
    --blue:#2f6feb; --blue-bg:#eaf1ff; --green:#0f8a5f; --green-bg:#e8f7f0;
    --red:#d04a4a; --red-bg:#fdeeee; --amber:#b7791f; --amber-bg:#fff5e2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  header{padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:16px;font-weight:600}
  header p{margin:3px 0 0;color:var(--tx2);font-size:12px}
  .dual{display:flex;gap:14px;padding:14px;align-items:stretch}
  .col{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);
       border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
       border-bottom:1px solid var(--line2);padding-bottom:10px}
  .col-head h2{margin:0;font-size:15px;font-weight:600}
  .col-head h2 .sid{font-weight:400;color:var(--tx3);font-size:12px;margin-left:6px}
  .badge{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px}
  .badge.ok{background:var(--green-bg);color:var(--green)}
  .badge.warn{background:var(--amber-bg);color:var(--amber)}
  .badge.dirty{background:var(--red-bg);color:var(--red)}
  .cinfo{font-size:11px;color:var(--tx2);line-height:1.5}
  .cinfo b{color:var(--tx)}
  .ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ctrl label{color:var(--tx2);font-size:12px;white-space:nowrap}
  input[type=file]{flex:1;min-width:140px;font-size:12px}
  input[type=number],input[type=text],select{padding:5px 7px;border:1px solid var(--line);
      border-radius:6px;background:#fff;color:var(--tx);font-size:12px;font-family:inherit}
  select{min-width:120px;max-width:200px}
  .btn{display:inline-block;padding:6px 12px;border:1px solid var(--blue);border-radius:6px;
       background:var(--blue);color:#fff;font-size:12px;cursor:pointer;font-family:inherit}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:#fff;color:var(--tx2);border-color:var(--line)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .msg{font-size:12px;color:var(--tx2);min-height:18px}
  .msg.err{color:var(--red)}
  details.params{border:1px solid var(--line2);border-radius:8px;padding:8px 12px}
  details.params summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--blue)}
  fieldset{border:none;border-top:1px solid var(--line2);margin:12px 0 0;padding:10px 0 0}
  legend{padding:0 8px 0 0;font-size:11px;font-weight:600;color:var(--blue)}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0}
  .row label{flex:1;color:var(--tx2);font-size:12px}
  .row .hint{color:var(--tx3);font-size:11px}
  .row input[type=number],.row input[type=text]{width:104px}
  .row select{width:auto}
  .row input[type=checkbox]{width:auto}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .kpi{background:#fafbfd;border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
  .kpi .k{font-size:11px;color:var(--tx3)}
  .kpi .v{font-size:17px;font-weight:600;margin-top:2px;line-height:1.25}
  .kpi .s{font-size:11px;color:var(--tx2);margin-top:1px}
  .concl{padding:8px 12px;border-radius:8px;font-size:12px;border:1px solid transparent}
  .concl.bad{background:var(--amber-bg);border-color:#f0d9a8;color:#8a5d10}
  .concl.good{background:var(--green-bg);border-color:#bfe7d3;color:#0b6b49}
  canvas{width:100%;height:150px;display:block}
  .card{border:1px solid var(--line2);border-radius:8px;padding:10px 12px}
  .card h3{margin:0 0 8px;font-size:13px;font-weight:600}
  .card h3 small{font-weight:400;color:var(--tx3);margin-left:8px;font-size:11px}
  .chart-note{font-size:11px;color:var(--tx3);margin-top:4px}
  .wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}
  th,td{padding:4px 6px;border-bottom:1px solid var(--line2);text-align:right}
  th{background:#fafbfd;color:var(--tx2);font-weight:500;position:sticky;top:0}
  th:first-child,td:first-child{text-align:left}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#f6f9ff}
  tbody tr.sel{background:var(--blue-bg)}
  .tag{display:inline-block;padding:0 5px;border-radius:3px;font-size:10px;font-weight:600}
  .tag.pass{background:var(--green-bg);color:var(--green)}
  .tag.fail{background:var(--red-bg);color:var(--red)}
  .tag.skip{background:#f1f3f7;color:var(--tx3)}
  .tag.valid{background:var(--green-bg);color:var(--green)}
  .tag.invalid{background:var(--red-bg);color:var(--red)}
  .peaks{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:#f7f9fc;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px}
  .chip b{color:var(--blue)}
  .meta{font-size:11px;color:var(--tx3);margin-top:4px}
  @media (max-width:1100px){.dual{flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>四门控频率分析 · 双传感器对比（WT901_front / WT901_back）</h1>
  <p>左右独立加载各自标定参数，上传激励 / 振动数据逐 30s 窗跑四门（G0 幅度 · G1 显著性 · G2 稳定性 · G3 频率下限），四门全过才输出可信主频 f1。</p>
</header>

<div class="dual" id="dual"></div>

<script>
"use strict";
const $g = id => document.getElementById(id);

async function post(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
                               body:JSON.stringify(body)});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
function tag(ok, txt){ return `<span class="tag ${ok?"pass":"fail"}">${txt||(ok?"PASS":"FAIL")}</span>`; }

// 纯绘图工具（不依赖实例）
function setupCv(cv){
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth||500, h=cv.clientHeight||150;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,w,h);
  return {c,w,h,pad:{l:54,r:12,t:10,b:24}};
}
function frame(o,xmin,xmax,ymin,ymax,xlab,ylab){
  const {c,w,h,pad}=o, X0=pad.l, X1=w-pad.r, Y0=pad.t, Y1=h-pad.b;
  c.strokeStyle="#eef1f6"; c.lineWidth=1; c.fillStyle="#8b95a5"; c.font="10px sans-serif";
  for(let i=0;i<=4;i++){
    const y=Y0+(Y1-Y0)*i/4; c.beginPath(); c.moveTo(X0,y); c.lineTo(X1,y); c.stroke();
    const v=ymax-(ymax-ymin)*i/4;
    c.textAlign="right"; c.fillText(Math.abs(v)>=100?v.toFixed(0):v.toFixed(2), X0-5, y+3);
  }
  for(let i=0;i<=5;i++){
    const x=X0+(X1-X0)*i/5; c.beginPath(); c.moveTo(x,Y0); c.lineTo(x,Y1); c.stroke();
    const v=xmin+(xmax-xmin)*i/5;
    c.textAlign="center"; c.fillText(v.toFixed(v<10?1:0), x, Y1+14);
  }
  c.strokeStyle="#cdd4df"; c.beginPath(); c.moveTo(X0,Y0); c.lineTo(X0,Y1); c.lineTo(X1,Y1); c.stroke();
  c.fillStyle="#8b95a5"; c.textAlign="right"; c.fillText(xlab,X1,Y1+20);
  c.save(); c.translate(12,Y0+8); c.textAlign="left"; c.fillText(ylab,0,0); c.restore();
  return {X0,X1,Y0,Y1};
}
function px(v,a,b,X0,X1){ return X0+(X1-X0)*(v-a)/Math.max(1e-12,b-a); }
function py(v,a,b,Y0,Y1){ return Y1-(Y1-Y0)*(v-a)/Math.max(1e-12,b-a); }

const SIDES = {
  front: {label:"WT901_front", sid:"front 传感器"},
  back:  {label:"WT901_back",  sid:"back 传感器"},
};

function makeAnalyzer(side, info){
  const pfx = side === "front" ? "f" : "b";
  const L = SIDES[side];
  const $ = id => document.getElementById(pfx+"_"+id);
  const S = {content:"", filename:"", result:null, sel:0, defaults:null,
             calib:null, calibDoc:null, dirty:false, side:side};

  function msg(t, err){ $("msg").textContent = t; $("msg").className = "msg" + (err ? " err" : ""); }
  function num(id){ const v = parseFloat($(id).value); return isNaN(v) ? 0 : v; }

  // ---- 构造 DOM ----
  let root;
  function build(){
    root = document.createElement("section");
    root.className = "col";
    root.innerHTML = `
      <div class="col-head">
        <h2>${L.label}<span class="sid">${L.sid}</span></h2>
        <span class="badge" id="${pfx}_calibBadge">—</span>
      </div>
      <div class="cinfo" id="${pfx}_calibInfo">标定：未加载</div>

      <div class="ctrl">
        <input type="file" id="${pfx}_file" accept=".csv,.txt,.tsv">
      </div>
      <div class="ctrl">
        <label>数据轴</label>
        <select id="${pfx}_axis"><option value="">（先上传文件）</option></select>
        <button class="btn" id="${pfx}_run">开始分析</button>
        <button class="btn ghost" id="${pfx}_reset">重置</button>
      </div>
      <div class="msg" id="${pfx}_msg">等待上传数据…</div>

      <details class="params">
        <summary>高级参数（标定已自动填充，一般无需改动）</summary>
        <fieldset><legend>分窗与采样</legend>
          <div class="row"><label>窗长 window_s <span class="hint">s</span></label><input type="number" id="${pfx}_window_s" step="1"></div>
          <div class="row"><label>采样率 fs <span class="hint">0=自动</span></label><input type="number" id="${pfx}_fs" step="any"></div>
          <div class="row"><label>单位换算 <span class="hint">0=自动</span></label><input type="number" id="${pfx}_unit_scale" step="any"></div>
          <div class="row"><label>每窗去趋势</label><input type="checkbox" id="${pfx}_detrend"></div>
          <div class="row"><label>最少样本数</label><input type="number" id="${pfx}_min_samples" step="1"></div>
          <div class="row"><label>最小跨度 <span class="hint">s</span></label><input type="number" id="${pfx}_min_span_s" step="any"></div>
        </fieldset>
        <fieldset><legend>预处理</legend>
          <div class="row"><label>去尖峰 <span class="hint">中值+MAD</span></label><input type="checkbox" id="${pfx}_despike"></div>
          <div class="row"><label>去尖峰窗口 <span class="hint">点</span></label><input type="number" id="${pfx}_spike_win" step="1"></div>
          <div class="row"><label>去尖峰 σ 倍数</label><input type="number" id="${pfx}_spike_nsig" step="any"></div>
          <div class="row"><label>高通截止 <span class="hint">Hz，0=关</span></label><input type="number" id="${pfx}_hp_cutoff" step="any"></div>
          <div class="row"><label>f1 亚格点插值</label><input type="checkbox" id="${pfx}_refine_f1"></div>
        </fieldset>
        <fieldset><legend>G0 幅度门</legend>
          <div class="row"><label>本底 RMS <span class="hint">0=自动</span></label><input type="number" id="${pfx}_noise_floor_mg" step="any"></div>
          <div class="row"><label>倍数 <span class="hint">RMS ≥ k×本底</span></label><input type="number" id="${pfx}_g0_rms_factor" step="0.1"></div>
        </fieldset>
        <fieldset><legend>G1 Welch 显著性门</legend>
          <div class="row"><label>峰/中位数 ≥</label><input type="number" id="${pfx}_g1_peak_ratio" step="any"></div>
          <div class="row"><label>分析带下限 <span class="hint">Hz</span></label><input type="number" id="${pfx}_f_lo" step="any"></div>
          <div class="row"><label>分析带上限 <span class="hint">Hz</span></label><input type="number" id="${pfx}_f_hi" step="any"></div>
          <div class="row"><label>Welch 段长 <span class="hint">s</span></label><input type="number" id="${pfx}_nperseg_s" step="any"></div>
        </fieldset>
        <fieldset><legend>G2 稳定性门</legend>
          <div class="row"><label>模式</label>
            <select id="${pfx}_g2_mode"><option value="band">band 带内验峰</option><option value="full">full 全带 argmax</option></select></div>
          <div class="row"><label>子窗数</label><input type="number" id="${pfx}_n_sub" step="1"></div>
          <div class="row"><label>CV 上限 <span class="hint">%</span></label><input type="number" id="${pfx}_g2_cv_max" step="any"></div>
          <div class="row"><label>搜索带 <span class="hint">f0±比例</span></label><input type="number" id="${pfx}_g2_band_frac" step="any"></div>
          <div class="row"><label>子窗峰 ≥ <span class="hint">×中位</span></label><input type="number" id="${pfx}_g2_sub_ratio" step="any"></div>
          <div class="row"><label>最少有效子窗</label><input type="number" id="${pfx}_g2_min_subs" step="1"></div>
        </fieldset>
        <fieldset><legend>G3 频率下限门</legend>
          <div class="row"><label>倍数 <span class="hint">f1 &gt; k/T</span></label><input type="number" id="${pfx}_g3_factor" step="any"></div>
          <div class="row"><label>绝对下限 <span class="hint">Hz</span></label><input type="number" id="${pfx}_f1_min_hz" step="any"></div>
        </fieldset>
        <fieldset><legend>多轴确认 / 证据</legend>
          <div class="row"><label>多轴同频确认</label><input type="checkbox" id="${pfx}_multi_axis"></div>
          <div class="row"><label>搜索带 <span class="hint">f1±比例</span></label><input type="number" id="${pfx}_ma_band_frac" step="any"></div>
          <div class="row"><label>他轴峰 ≥ <span class="hint">×中位</span></label><input type="number" id="${pfx}_ma_ratio" step="any"></div>
          <div class="row"><label>谐波族检查</label><input type="checkbox" id="${pfx}_harmonic_check"></div>
          <div class="row"><label>谐波峰 ≥</label><input type="number" id="${pfx}_harm_ratio" step="any"></div>
          <div class="row"><label>过零+Hilbert</label><input type="checkbox" id="${pfx}_xcheck"></div>
        </fieldset>
        <fieldset><legend>显著峰</legend>
          <div class="row"><label>峰个数</label><input type="number" id="${pfx}_n_peaks" step="1"></div>
          <div class="row"><label>峰/中位数 ≥</label><input type="number" id="${pfx}_peak_min_ratio" step="any"></div>
        </fieldset>
      </details>

      <div class="cards">
        <div class="kpi"><div class="k">VALID 窗</div><div class="v" id="${pfx}_kValid">—</div><div class="s" id="${pfx}_kValidSub">—</div></div>
        <div class="kpi"><div class="k">状态</div><div class="v" id="${pfx}_kState">—</div><div class="s" id="${pfx}_kStateSub">—</div></div>
        <div class="kpi"><div class="k">当前窗 f1</div><div class="v" id="${pfx}_kF1">—</div><div class="s" id="${pfx}_kF1Sub">—</div></div>
        <div class="kpi"><div class="k">本底 RMS</div><div class="v" id="${pfx}_kNoise">—</div><div class="s" id="${pfx}_kNoiseSub">—</div></div>
      </div>
      <div class="concl bad" id="${pfx}_concl">尚未分析。</div>

      <div class="card"><h3>原始时程 <small id="${pfx}_curveTitle">—</small></h3>
        <canvas id="${pfx}_curve"></canvas>
        <div class="chart-note">竖虚线为窗口边界；浅蓝底为当前选中窗，点表格或曲线可切换。</div></div>
      <div class="card"><h3>Welch 功率谱 <small id="${pfx}_specTitle">—</small></h3>
        <canvas id="${pfx}_spectrum"></canvas>
        <div class="chart-note">红虚线为主频 f1，圆点为各阶显著峰；灰遮罩为分析带外。</div></div>
      <div class="card"><h3>逐窗四门明细 <small>点击行切换频谱</small></h3>
        <div class="wrap"><table id="${pfx}_tbl"><thead><tr>
          <th>窗</th><th>区间 s</th><th>n</th><th>RMS</th><th>G0阈</th><th>G0</th>
          <th>峰/底</th><th>G1</th><th>子窗主频 Hz</th><th>CV%</th><th>G2</th>
          <th>f1 Hz</th><th>k/T</th><th>G3</th><th>判定</th><th>多轴</th>
        </tr></thead><tbody></tbody></table></div></div>
      <div class="card"><h3>当前窗显著峰 <small id="${pfx}_peakTitle">—</small></h3>
        <div class="peaks" id="${pfx}_peaks"><span class="meta">尚未分析</span></div>
        <div class="meta" id="${pfx}_confirmBox" style="margin-top:8px"></div>
      </div>
    `;
    $g("dual").appendChild(root);
  }

  function setBadge(txt, cls){ const b=$("calibBadge"); b.textContent=txt; b.className="badge "+(cls||""); }

  function renderCalib(meta){
    if(!meta){
      $("calibInfo").innerHTML = "标定：<b>未加载</b> · 使用内置 DEFAULTS";
      setBadge("未标定","warn");
      return;
    }
    const s = meta.sensor || {};
    $("calibInfo").innerHTML =
      `标定：<b>${s.id||"?"}</b> / ${s.model||"?"} · ±${s.range_g??"?"}g @ ${s.rate_hz??"?"}Hz · `+
      `本底 ${meta.noise_floor_mg??"?"}mg · 有效至 ${meta.valid_until||"?"}`;
    setBadge("已标定","ok");
  }

  function fillForm(d){
    const pct = v => (v*100).toFixed(3).replace(/\.?0+$/,"");
    $("window_s").value=d.window_s; $("fs").value=d.fs; $("unit_scale").value=d.unit_scale;
    $("detrend").checked=!!d.detrend; $("min_samples").value=d.min_samples; $("min_span_s").value=d.min_span_s;
    $("noise_floor_mg").value=d.noise_floor_mg; $("g0_rms_factor").value=d.g0_rms_factor;
    $("g1_peak_ratio").value=d.g1_peak_ratio; $("f_lo").value=d.f_lo; $("f_hi").value=d.f_hi;
    $("nperseg_s").value=d.nperseg_s; $("n_sub").value=d.n_sub; $("g2_cv_max").value=pct(d.g2_cv_max);
    $("g3_factor").value=d.g3_factor; $("f1_min_hz").value=d.f1_min_hz;
    $("n_peaks").value=d.n_peaks; $("peak_min_ratio").value=d.peak_min_ratio;
    $("despike").checked=!!d.despike; $("spike_win").value=d.spike_win; $("spike_nsig").value=d.spike_nsig;
    $("hp_cutoff").value=d.hp_cutoff; $("refine_f1").checked=!!d.refine_f1;
    $("g2_mode").value=(d.g2_mode==="full")?"full":"band";
    $("g2_band_frac").value=d.g2_band_frac; $("g2_sub_ratio").value=d.g2_sub_ratio;
    $("g2_min_subs").value=d.g2_min_subs;
    $("multi_axis").checked=!!d.multi_axis; $("ma_band_frac").value=d.ma_band_frac; $("ma_ratio").value=d.ma_ratio;
    $("harmonic_check").checked=!!d.harmonic_check; $("harm_ratio").value=d.harm_ratio;
    $("xcheck").checked=!!d.xcheck;
  }

  function collect(){
    return {
      window_s:num("window_s"), fs:num("fs"), unit_scale:num("unit_scale"),
      detrend:$("detrend").checked, min_samples:num("min_samples"), min_span_s:num("min_span_s"),
      noise_floor_mg:num("noise_floor_mg"), g0_rms_factor:num("g0_rms_factor"),
      g1_peak_ratio:num("g1_peak_ratio"), f_lo:num("f_lo"), f_hi:num("f_hi"),
      nperseg_s:num("nperseg_s"), n_sub:num("n_sub"), g2_cv_max:num("g2_cv_max")/100,
      g3_factor:num("g3_factor"), f1_min_hz:num("f1_min_hz"),
      n_peaks:num("n_peaks"), peak_min_ratio:num("peak_min_ratio"),
      despike:$("despike").checked, spike_win:num("spike_win"), spike_nsig:num("spike_nsig"),
      hp_cutoff:num("hp_cutoff"), refine_f1:$("refine_f1").checked,
      g2_mode:$("g2_mode").value, g2_band_frac:num("g2_band_frac"),
      g2_sub_ratio:num("g2_sub_ratio"), g2_min_subs:num("g2_min_subs"),
      multi_axis:$("multi_axis").checked, ma_band_frac:num("ma_band_frac"), ma_ratio:num("ma_ratio"),
      harmonic_check:$("harmonic_check").checked, harm_ratio:num("harm_ratio"),
      xcheck:$("xcheck").checked
    };
  }

  function fillAxis(cols, def){
    const sel=$("axis"); sel.innerHTML="";
    const prio=c=>{const m=c.match(/加速度([XYZ])/);return m?(m[1].charCodeAt(0)-88):9;};
    [...cols].sort((a,b)=>prio(a)-prio(b)).forEach(c=>{
      const o=document.createElement("option"); o.value=c; o.textContent=c; sel.appendChild(o);
    });
    if(def) sel.value=def;
  }

  // ---- 绘图 ----
  function drawCurve(res){
    const cv=$("curve"), o=setupCv(cv), {c,pad}=o;
    const t=res.series.t, y=res.series.y;
    if(!t.length) return;
    const tmin=Math.min(...t), tmax=Math.max(...t);
    let lo=Math.min(...y), hi=Math.max(...y); const m=Math.max((hi-lo)*0.12,1e-6); lo-=m; hi+=m;
    const F=frame(o,tmin,tmax,lo,hi,"时间 / s",res.meta.unit);
    const W=res.meta.params.window_s;
    const cur=res.windows[S.sel];
    if(cur){
      c.fillStyle="rgba(47,111,235,.08)";
      c.fillRect(px(cur.t0,tmin,tmax,F.X0,F.X1),F.Y0,
                 Math.max(2,px(cur.t1,tmin,tmax,F.X0,F.X1)-px(cur.t0,tmin,tmax,F.X0,F.X1)),F.Y1-F.Y0);
    }
    c.strokeStyle="#c9d3e3"; c.setLineDash([3,3]);
    for(let s=W;s<tmax;s+=W){
      const x=px(s,tmin,tmax,F.X0,F.X1);
      c.beginPath(); c.moveTo(x,F.Y0); c.lineTo(x,F.Y1); c.stroke();
    }
    c.setLineDash([]);
    c.strokeStyle="#2f6feb"; c.lineWidth=1.2; c.beginPath();
    for(let i=0;i<t.length;i++){
      const X=px(t[i],tmin,tmax,F.X0,F.X1), Y=py(y[i],lo,hi,F.Y0,F.Y1);
      i?c.lineTo(X,Y):c.moveTo(X,Y);
    }
    c.stroke();
  }

  function drawSpectrum(res){
    const cv=$("spectrum"), o=setupCv(cv), {c}=o;
    const w=res.windows[S.sel];
    if(!w || !w.welch || !w.welch.freq.length){
      c.fillStyle="#8b95a5"; c.font="12px sans-serif"; c.textAlign="center";
      c.fillText("该窗无功率谱",o.w/2,o.h/2); return;
    }
    const f=w.welch.freq, p=w.welch.power;
    const lg=p.map(v=>Math.log10(Math.max(v,1e-15)));
    const fmin=Math.min(...f), fmax=Math.max(...f);
    let lo=Math.min(...lg), hi=Math.max(...lg); const m=Math.max((hi-lo)*0.1,0.2); lo-=m; hi+=m;
    const F=frame(o,fmin,fmax,lo,hi,"频率 / Hz","log10 PSD");
    const plo=res.meta.params.f_lo, phi=Math.min(res.meta.params.f_hi,res.meta.nyquist_hz);
    c.fillStyle="rgba(140,148,160,.10)";
    c.fillRect(F.X0,F.Y0,Math.max(0,px(plo,fmin,fmax,F.X0,F.X1)-F.X0),F.Y1-F.Y0);
    c.fillRect(px(phi,fmin,fmax,F.X0,F.X1),F.Y0,Math.max(0,F.X1-px(phi,fmin,fmax,F.X0,F.X1)),F.Y1-F.Y0);
    c.strokeStyle="#0f8a5f"; c.lineWidth=1.4; c.beginPath();
    for(let i=0;i<f.length;i++){
      const X=px(f[i],fmin,fmax,F.X0,F.X1), Y=py(lg[i],lo,hi,F.Y0,F.Y1);
      i?c.lineTo(X,Y):c.moveTo(X,Y);
    }
    c.stroke();
    if(w.f1_hz){
      const x=px(w.f1_hz,fmin,fmax,F.X0,F.X1);
      c.strokeStyle="#d04a4a"; c.lineWidth=1.5; c.setLineDash([5,3]);
      c.beginPath(); c.moveTo(x,F.Y0); c.lineTo(x,F.Y1); c.stroke(); c.setLineDash([]);
      c.fillStyle="#d04a4a"; c.font="10px sans-serif"; c.textAlign="left";
      c.fillText("f1 "+w.f1_hz.toFixed(3)+"Hz",Math.min(x+5,F.X1-90),F.Y0+12);
    }
    (w.peaks||[]).forEach((q,i)=>{
      const x=px(q.f_hz,fmin,fmax,F.X0,F.X1);
      c.fillStyle="#2f6feb"; c.beginPath(); c.arc(x,F.Y1-5-(i%3)*12,3,0,Math.PI*2); c.fill();
    });
  }

  // ---- 渲染 ----
  function renderCards(res){
    const s=res.state, w=res.windows[S.sel];
    $("kValid").textContent = s.valid_count + " / " + s.evaluated;
    $("kValidSub").textContent = "共 " + s.total_windows + " 窗";
    $("kState").textContent = s.status;
    $("kState").style.color = s.status==="VALID" ? "var(--green)" : (s.status==="NO_VALID" ? "var(--red)" : "var(--amber)");
    $("kStateSub").textContent = w ? ("w"+w.idx+" · "+(w.reason||"")) : "—";
    $("kF1").textContent = w && w.f1_hz ? w.f1_hz.toFixed(3)+" Hz" : "—";
    $("kF1Sub").textContent = w ? ("峰/底 "+(w.peak_ratio??"—")+" · CV "+(w.cv!=null?(w.cv*100).toFixed(1)+"%":"—")) : "—";
    $("kNoise").textContent = res.noise_floor + " " + res.meta.unit;
    $("kNoiseSub").textContent = "带 " + res.meta.params.f_lo + "~" + Math.min(res.meta.params.f_hi,res.meta.nyquist_hz) + "Hz";
    const box=$("concl");
    if(s.has_output){
      box.className="concl good";
      box.textContent="存在 VALID 窗：最后有效窗 w"+s.last_valid.idx+"（t="+s.last_valid.t1+
        "s）主频 f1="+s.last_valid.f1_hz+"Hz。"+(s.stale?"当前窗无效，沿用该值（时效 "+s.age_s+"s）。":"当前窗有效，f1 已刷新。");
    }else{
      const fails=["g0","g1","g2","g3"].map((k,i)=>["G0","G1","G2","G3"][i]+" "+
        res.windows.filter(w=>!w.skipped&&!w[k]).length+"/"+s.evaluated);
      box.className="concl bad";
      box.textContent="四门全拦：0 个 VALID 窗，无可信主频。各门未通过 "+fails.join(" · ")+"；静止段本就不应出主频。";
    }
  }

  function renderTable(res){
    const tb=$("tbl").querySelector("tbody"); tb.innerHTML="";
    res.windows.forEach((w,i)=>{
      const tr=document.createElement("tr");
      tr.className = i===S.sel ? "sel":"";
      const cell=v=>{const td=document.createElement("td"); td.innerHTML=v===null||v===undefined?"—":v; return td;};
      tr.appendChild(cell("w"+w.idx));
      tr.appendChild(cell(w.t0.toFixed(1)+"~"+w.t1.toFixed(1)));
      tr.appendChild(cell(w.n));
      if(w.skipped){
        tr.appendChild(cell(w.rms_mg)); tr.appendChild(cell("—"));
        for(let k=0;k<9;k++) tr.appendChild(cell("—"));
        tr.appendChild(cell('<span class="tag skip">SKIPPED</span>'));
        tr.appendChild(cell("—"));
      }else{
        tr.appendChild(cell(w.rms_mg.toFixed(3)));
        tr.appendChild(cell(w.g0_threshold.toFixed(3)));
        tr.appendChild(cell(tag(w.g0)));
        tr.appendChild(cell(w.peak_ratio.toFixed(2)));
        tr.appendChild(cell(tag(w.g1)));
        tr.appendChild(cell((w.sub_freqs||[]).map(v=>v==null?"—":v.toFixed(2)).join(" ")));
        tr.appendChild(cell(w.cv==null?"—":(w.cv*100).toFixed(1)));
        tr.appendChild(cell(tag(w.g2)));
        tr.appendChild(cell(w.f1_hz==null?"—":w.f1_hz.toFixed(3)));
        tr.appendChild(cell(w.g3_threshold_hz.toFixed(3)));
        tr.appendChild(cell(tag(w.g3)));
        tr.appendChild(cell('<span class="tag '+(w.valid?"valid":"invalid")+'">'+w.state+'</span>'));
        tr.appendChild(cell(w.confirmed
          ? '<span class="tag pass">✓'+((w.confirm&&w.confirm.axes_ok)||0)+'轴</span>'
          : (w.confirm ? '<span class="tag fail">未确认</span>' : "—")));
      }
      tr.onclick=()=>{ if(!w.skipped){ S.sel=i; renderTable(res); drawCurve(res); drawSpectrum(res); renderPeaks(res); renderCards(res);} };
      tb.appendChild(tr);
    });
  }

  function renderPeaks(res){
    const w=res.windows[S.sel], box=$("peaks");
    $("peakTitle").textContent = w ? ("w"+w.idx+"  "+w.t0.toFixed(1)+"~"+w.t1.toFixed(1)+"s") : "—";
    box.innerHTML="";
    if(!w || !w.peaks || !w.peaks.length){
      box.innerHTML='<span class="meta">无满足阈值的显著峰</span>';
    }else{
      w.peaks.forEach(q=>{
        const d=document.createElement("div"); d.className="chip";
        d.innerHTML="<b>"+q.f_hz.toFixed(3)+" Hz</b> · 峰/底 "+q.ratio.toFixed(1)+
          " · 阶次比 "+q.order.toFixed(2)+(q.n_est?(" (n≈"+q.n_est+")"):"");
        box.appendChild(d);
      });
    }
    const cb=$("confirmBox"); cb.innerHTML="";
    if(w && !w.skipped && w.confirm){
      const c=w.confirm, parts=[];
      const axTags=Object.entries(c.axes||{}).map(([k,v])=>
        v ? (k+"轴 "+v.f_hz.toFixed(3)+"Hz ×"+v.ratio.toFixed(0)+" "+(v.ok?"✓":"✗")) : (k+"轴 无峰")).join(" · ");
      if(Object.keys(c.axes||{}).length) parts.push("多轴同频："+axTags+" → "+(w.confirmed?"已确认":"未确认"));
      if(c.cross) parts.push("过零 "+(c.cross.f_zc==null?"—":c.cross.f_zc.toFixed(3))+"Hz / Hilbert "+
        (c.cross.f_hilbert==null?"—":c.cross.f_hilbert.toFixed(3))+"Hz → "+(c.cross.ok?"一致 ✓":"不一致 ✗"));
      if(c.amp_eq_mg!=null) parts.push("等效幅值 "+c.amp_eq_mg+" "+res.meta.unit);
      if(w.n_spike) parts.push("去尖峰剔除 "+w.n_spike+" 点");
      cb.innerHTML = parts.length ? parts.join("<br>") : "";
    }
  }

  function render(res){
    S.result=res;
    const ok=res.windows.map((w,i)=>({w,i})).filter(o=>!o.w.skipped);
    S.sel = ok.length ? ok[ok.length-1].i : 0;
    const m=res.meta;
    $("curveTitle").textContent = m.filename+" · "+m.axis+" ("+m.unit+") · fs="+m.fs+"Hz · "+m.n_samples+" 点 / "+m.duration_s+"s";
    const tq = m.time_quality || {};
    if(tq.bad_timestamp_count > 0){
      const rows = (tq.bad_timestamp_rows||[]).slice(0,5).join(",");
      $("curveTitle").textContent += " 【警告】已剔除 "+tq.bad_timestamp_count+" 行时间戳损坏数据（第 "+rows+" 行）";
    }
    $("specTitle").textContent = "带 "+m.params.f_lo+"~"+Math.min(m.params.f_hi,m.nyquist_hz)+"Hz · Nyquist="+m.nyquist_hz+"Hz";
    if(m.calib){
      const rw=m.calib.runtime_warnings||[];
      if(S.dirty) setBadge("参数已偏离标定","dirty");
      else if(rw.length) setBadge("指纹不匹配","dirty");
    }
    renderCards(res); drawCurve(res); drawSpectrum(res); renderTable(res); renderPeaks(res);
    msg("分析完成："+res.state.valid_count+" 个 VALID 窗 / "+res.state.evaluated+" 个评估窗"
        + (tq.bad_timestamp_count>0 ? "；已剔除 "+tq.bad_timestamp_count+" 行坏时间戳数据" : ""));
  }

  // ---- 初始化：先建 DOM、填参数，再绑定事件 ----
  build();
  S.defaults = info.defaults;
  S.calib = info.meta || null;
  fillForm(S.defaults);
  renderCalib(S.calib);

  // ---- 事件 ----
  $("file").onchange = async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      S.content=await f.text(); S.filename=f.name;
      const r=await post("/api/columns",{content:S.content});
      fillAxis(r.axes,r.default);
      msg("已载入 "+f.name+" · "+r.rows+" 行 · "+r.axes.length+" 个数值列");
    }catch(err){ msg("载入失败："+err.message,true); }
  };

  $("run").onclick = async ()=>{
    if(!S.content){ msg("请先上传 csv / txt 文件",true); return; }
    if(!$("axis").value){ msg("请先选择数据轴",true); return; }
    const btn=$("run"); btn.disabled=true; msg("计算中…");
    try{
      const res=await post("/api/analyze",{content:S.content,filename:S.filename,
                                           axis:$("axis").value,side:S.side,params:collect()});
      render(res);
    }catch(err){ msg("分析失败："+err.message,true); }
    finally{ btn.disabled=false; }
  };

  $("reset").onclick = ()=>{
    if(S.defaults) fillForm(S.defaults);
    S.dirty=false; renderCalib(S.calib);
    msg(S.calib?"参数已重置为标定值":"参数已重置为默认值");
  };

  $("curve").onclick = e=>{
    if(!S.result) return;
    const r=$("curve").getBoundingClientRect();
    const tmax=Math.max(...S.result.series.t), tmin=Math.min(...S.result.series.t);
    const pad=54, w=r.width-12-pad;
    const t=tmin+(e.clientX-r.left-pad)/Math.max(1,w)*(tmax-tmin);
    const hit=S.result.windows.findIndex(q=>t>=q.t0&&t<=q.t1&&!q.skipped);
    if(hit>=0){ S.sel=hit; drawCurve(S.result); drawSpectrum(S.result); renderTable(S.result); renderPeaks(S.result); renderCards(S.result); }
  };

  // 手改参数即标记偏离标定
  const details = root.querySelector("details.params");
  details.addEventListener("change", e=>{ S.dirty=true; setBadge("参数已偏离标定","dirty"); }, true);

  window.addEventListener("resize",()=>{ if(S.result){ drawCurve(S.result); drawSpectrum(S.result); } });

  msg(S.calib ? "已连接，标定参数已生效。上传激励/振动数据后点「开始分析」。"
              : "已连接（该侧未加载标定，用内置默认）。上传数据后点「开始分析」。");
  return { el: root, S:S };
}

(async ()=>{
  try{
    const j = await (await fetch("/api/defaults")).json();
    makeAnalyzer("front", j.front || {defaults:{}, meta:null});
    makeAnalyzer("back",  j.back  || {defaults:{}, meta:null});
  }catch(err){
    $g("dual").innerHTML = '<div class="concl bad" style="margin:16px">服务连接失败：'+err.message+'</div>';
  }
})();
</script>
</body>
</html>
