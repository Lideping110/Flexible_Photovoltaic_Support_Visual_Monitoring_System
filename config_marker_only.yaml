# 临时回归用：仅 marker_cam_01（避免 pole 长视频拖慢 N≥4 重锁回归验证）
cameras:
  - id: marker_cam_01
    url: "babiao/fast_move_shorter.mp4"
    task: marker
models:
  marker_det:
    openvino_dir: "./models/marker26s_det_openvino_model"
    weights: "./models/marker26s_det.pt"
    confidence: 0.25
    class_id: 0
    device: "intel:gpu"
    tracker: "bytetrack.yaml"
marker:
  fft:
    window_s: 30.0
    snr: 5.0
    min_samples: 32
  calibration:
    real_diameter_mm: 100.0
    frames: 8
    min_frames: 1
  localization:
    structure_sigma: 1.5
    min_lambda_min: 5000.0
    subpixel_window: 5
    win_ratio: 0.25
    win_max: 20
    min_spacing: 5
    max_jump_px: 3.0
  tracking:
    tracker: "bytetrack.yaml"
    persist: true
runtime:
  output_dir: "output"
  log_level: "INFO"
  display: false
  capture:
    mode: threads
    reconnect_s: 5
    rtsp_low_latency: true
  batch:
    marker:
      max_frames: 8
      timeout_ms: 60
  queue:
    marker_frame: 16
    result: 256
    spectrum: 512
  init:
    persist: true
    anchor:
      iou_min: 0.3
      release_after_s: 10.0
      ema_alpha: 0.05
      relock_max_px: 200.0
